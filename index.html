<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Dashboard Financeiro — Alex & Natalia</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<style>
  :root {
    --bg: #0a0a0a; --surface: #111; --card: #161616; --border: #222;
    --green: #00c97a; --yellow: #f5b700; --red: #ff4545;
    --text: #f0f0f0; --muted: #888; --dim: #444;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; min-height: 100vh; }
  .container { max-width: 480px; margin: 0 auto; padding: 16px; }
  .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding-bottom: 16px; border-bottom: 1px solid var(--border); }
  .header h1 { font-size: 16px; font-weight: 600; }
  .header p { font-size: 11px; color: var(--muted); margin-top: 2px; }
  .btn-refresh { background: var(--surface); border: 1px solid var(--border); color: var(--text); padding: 8px 12px; border-radius: 8px; cursor: pointer; font-size: 14px; display: flex; align-items: center; gap: 6px; }
  .btn-refresh:hover { background: var(--card); }
  .kpis { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
  .kpi { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 14px; }
  .kpi-label { font-size: 10px; color: var(--muted); font-weight: 600; letter-spacing: .5px; text-transform: uppercase; margin-bottom: 6px; }
  .kpi-value { font-size: 22px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .kpi-sub { font-size: 11px; color: var(--muted); margin-top: 3px; }
  .tabs { display: flex; background: var(--surface); border-radius: 10px; padding: 3px; margin-bottom: 16px; border: 1px solid var(--border); }
  .tab { flex: 1; padding: 8px; text-align: center; font-size: 13px; font-weight: 500; border-radius: 8px; cursor: pointer; color: var(--muted); border: none; background: transparent; }
  .tab.active { background: var(--card); color: var(--text); border: 1px solid var(--border); }
  .cat-item { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px; margin-bottom: 8px; }
  .cat-row { display: flex; justify-content: space-between; align-items: center; }
  .cat-name { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 500; }
  .cat-name i { font-size: 15px; color: var(--muted); }
  .cat-pct { font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .bar-bg { height: 4px; background: var(--border); border-radius: 2px; margin: 8px 0 6px; overflow: hidden; }
  .bar-fill { height: 100%; border-radius: 2px; transition: width .6s ease; }
  .cat-vals { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .tx-item { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
  .tx-desc { font-size: 13px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 200px; }
  .tx-meta { display: flex; align-items: center; gap: 6px; margin-top: 3px; font-size: 11px; color: var(--muted); }
  .tx-right { text-align: right; flex-shrink: 0; }
  .tx-valor { font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums; margin-bottom: 4px; }
  .badge { font-size: 10px; padding: 2px 7px; border-radius: 4px; font-weight: 600; }
  .badge-alex { background: #0d2a47; color: #5ba3f5; }
  .badge-natalia { background: #2a1f00; color: #f5b700; }
  .badge-casal { background: #1a1a1a; color: #888; }
  .badge-fixo { background: #1a1a1a; color: #555; font-size: 10px; padding: 1px 5px; border-radius: 3px; }
  .loading { text-align: center; padding: 40px; color: var(--muted); font-size: 14px; }
  .loading i { font-size: 28px; display: block; margin-bottom: 12px; animation: spin 1s linear infinite; }
  .error { background: #1a0000; border: 1px solid #3a0000; border-radius: 12px; padding: 16px; color: var(--red); font-size: 13px; margin-bottom: 16px; }
  .footer { text-align: center; font-size: 11px; color: var(--dim); padding: 20px 0 8px; }
  .green { color: var(--green); }
  .yellow { color: var(--yellow); }
  .red { color: var(--red); }
  @keyframes spin { from{transform:rotate(0)} to{transform:rotate(360deg)} }
  @media (prefers-color-scheme: light) {
    :root { --bg:#f5f5f5; --surface:#fff; --card:#f0f0f0; --border:#e0e0e0; --text:#111; --muted:#666; --dim:#aaa; }
  }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <div>
      <h1 id="titulo">Dashboard Financeiro</h1>
      <p id="atualizado">Carregando...</p>
    </div>
    <button class="btn-refresh" onclick="loadData()">
      <i class="ti ti-refresh" id="refresh-icon"></i> Atualizar
    </button>
  </div>
  <div id="content"><div class="loading"><i class="ti ti-refresh"></i>Carregando dados...</div></div>
  <p class="footer">Atualiza automaticamente a cada 5 min</p>
</div>

<script>
const WEBHOOK = "https://alexviniciuss.app.n8n.cloud/webhook/dashboard-financeiro";
let currentTab = "categorias";
let currentData = null;

const brl = n => new Intl.NumberFormat('pt-BR', {style:'currency',currency:'BRL',maximumFractionDigits:0}).format(n||0);

const catIcons = {
  'Moradia':'ti-home','Transporte':'ti-car','Alimentação':'ti-salad',
  'Saúde & Fitness':'ti-heart-rate-monitor','Pets':'ti-paw',
  'Pessoal & Beleza':'ti-scissors','Comunicação':'ti-device-mobile',
  'Educação':'ti-school','Fé & Comunidade':'ti-building-church',
  'Assinaturas':'ti-player-play','Lazer & Variável':'ti-confetti','Outros':'ti-box'
};

async function loadData() {
  const icon = document.getElementById('refresh-icon');
  icon.style.animation = 'spin 1s linear infinite';
  try {
    const r = await fetch(WEBHOOK);
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    currentData = await r.json();
    render();
  } catch(e) {
    document.getElementById('content').innerHTML = `
      <div class="error"><i class="ti ti-alert-circle"></i> Erro ao carregar: ${e.message}<br><small>Verifique se o workflow está publicado no n8n.</small></div>`;
  } finally {
    icon.style.animation = '';
  }
}

function render() {
  const d = currentData;
  document.getElementById('titulo').textContent = `${d.mes} · Alex & Natalia`;
  document.getElementById('atualizado').textContent = `Atualizado ${d.atualizadoEm}`;

  const pctColor = d.pctGasto >= 90 ? 'red' : d.pctGasto >= 75 ? 'yellow' : 'green';

  let html = `
    <div class="kpis">
      <div class="kpi"><div class="kpi-label">Renda líquida</div><div class="kpi-value">${brl(d.renda)}</div></div>
      <div class="kpi"><div class="kpi-label">Gasto no mês</div><div class="kpi-value ${d.pctGasto>90?'red':''}">${brl(d.totalGasto)}</div></div>
      <div class="kpi"><div class="kpi-label">Surplus</div><div class="kpi-value green">${brl(d.surplus)}</div><div class="kpi-sub">disponível p/ investir</div></div>
      <div class="kpi"><div class="kpi-label">% usado</div><div class="kpi-value ${pctColor}">${d.pctGasto}%</div><div class="kpi-sub">da renda líquida</div></div>
    </div>
    <div class="tabs">
      <button class="tab ${currentTab==='categorias'?'active':''}" onclick="switchTab('categorias')">Categorias</button>
      <button class="tab ${currentTab==='transações'?'active':''}" onclick="switchTab('transações')">Transações</button>
    </div>`;

  if (currentTab === 'categorias') {
    html += d.categorias.map(c => {
      const color = c.pct>=100?'red':c.pct>=80?'yellow':'green';
      const icon = catIcons[c.nome] || 'ti-box';
      return `<div class="cat-item">
        <div class="cat-row">
          <div class="cat-name"><i class="ti ${icon}"></i>${c.nome}</div>
          <div class="cat-pct ${color}">${c.pct}%</div>
        </div>
        <div class="bar-bg"><div class="bar-fill" style="width:${Math.min(c.pct,100)}%;background:var(--${color})"></div></div>
        <div class="cat-vals"><span>${brl(c.gasto)}</span><span>/ ${brl(c.orcamento)}</span></div>
      </div>`;
    }).join('');
  } else {
    html += d.recentes.map(t => {
      const badge = t.quem==='Alex'?'badge-alex':t.quem==='Natalia'?'badge-natalia':'badge-casal';
      const dia = t.data?t.data.slice(8)+'/'+t.data.slice(5,7):'';
      return `<div class="tx-item">
        <div style="flex:1;min-width:0">
          <div class="tx-desc">${t.descricao}</div>
          <div class="tx-meta">
            <span>${dia}</span><span>·</span><span>${t.categoria}</span>
            ${t.fixo?'<span class="badge-fixo">fixo</span>':''}
          </div>
        </div>
        <div class="tx-right">
          <div class="tx-valor">${brl(t.valor)}</div>
          <span class="badge ${badge}">${t.quem||'Casal'}</span>
        </div>
      </div>`;
    }).join('');
  }

  document.getElementById('content').innerHTML = html;
}

function switchTab(tab) {
  currentTab = tab;
  render();
}

loadData();
setInterval(loadData, 5 * 60 * 1000);
</script>
</body>
</html>
