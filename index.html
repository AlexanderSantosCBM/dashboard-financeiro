<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Controle Financeiro — Alex & Natalia</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap');

:root {
  --bg:#0c0c0e; --surface:#141416; --card:#1a1a1e; --border:#242428;
  --green:#00d68f; --yellow:#ffb627; --red:#ff4d4d; --blue:#4d9fff;
  --text:#f2f2f5; --muted:#7a7a8a; --dim:#3a3a45;
  --renda: 14224;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh;font-size:14px}
.wrap{max-width:520px;margin:0 auto;padding:20px 16px 40px}

/* HEADER */
.header{margin-bottom:24px}
.header-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:4px}
.header h1{font-size:20px;font-weight:700;letter-spacing:-.3px}
.header p{font-size:11px;color:var(--muted);margin-top:3px}
.saldo-destaque{background:linear-gradient(135deg,#00d68f15,#00d68f05);border:1px solid #00d68f30;border-radius:14px;padding:14px 16px;margin-bottom:20px;display:flex;justify-content:space-between;align-items:center}
.saldo-label{font-size:10px;color:var(--green);font-weight:700;letter-spacing:1px;text-transform:uppercase;margin-bottom:4px}
.saldo-val{font-size:28px;font-weight:700;color:var(--green);font-family:'DM Mono',monospace;letter-spacing:-1px}
.saldo-sub{font-size:11px;color:var(--muted)}
.btn-refresh{background:var(--surface);border:1px solid var(--border);color:var(--muted);padding:8px 14px;border-radius:10px;cursor:pointer;font-size:12px;font-family:'DM Sans',sans-serif;transition:.2s}
.btn-refresh:hover{color:var(--text);border-color:var(--dim)}

/* KPIs */
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:24px}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px}
.kpi-label{font-size:10px;color:var(--muted);font-weight:600;letter-spacing:.6px;text-transform:uppercase;margin-bottom:6px}
.kpi-value{font-size:21px;font-weight:700;font-family:'DM Mono',monospace;letter-spacing:-1px}
.kpi-sub{font-size:11px;color:var(--muted);margin-top:3px}

/* TABS */
.tabs{display:flex;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:3px;margin-bottom:20px;gap:2px}
.tab{flex:1;padding:9px;text-align:center;font-size:12px;font-weight:600;border-radius:9px;cursor:pointer;color:var(--muted);border:none;background:transparent;font-family:'DM Sans',sans-serif;letter-spacing:.3px;transition:.2s}
.tab.active{background:var(--card);color:var(--text);border:1px solid var(--border)}

/* SECTIONS */
.section{margin-bottom:24px}
.section-title{font-size:10px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted);margin-bottom:12px;display:flex;align-items:center;gap:8px}
.section-title::after{content:'';flex:1;height:1px;background:var(--border)}

/* CHART CARD */
.chart-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:12px}
.chart-card h3{font-size:12px;font-weight:600;color:var(--muted);margin-bottom:14px;letter-spacing:.3px}
.chart-wrap{position:relative;height:180px}

/* TABLE */
.tbl-wrap{background:var(--surface);border:1px solid var(--border);border-radius:14px;overflow:hidden;margin-bottom:12px}
.tbl-scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:11px;font-family:'DM Mono',monospace}
thead th{background:var(--card);padding:10px 10px;text-align:right;font-size:9px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--muted);white-space:nowrap}
thead th:first-child{text-align:left}
tbody td{padding:9px 10px;text-align:right;border-top:1px solid var(--border);color:var(--text)}
tbody td:first-child{text-align:left;color:var(--muted);font-size:10px}
tbody tr:last-child td{font-weight:700;color:var(--text);background:var(--card)}
tbody tr:hover td{background:#ffffff05}

/* CATEGORY BARS */
.cat-item{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px 14px;margin-bottom:8px}
.cat-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:7px}
.cat-name{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:500}
.cat-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.cat-pct{font-size:13px;font-weight:700;font-family:'DM Mono',monospace}
.bar-bg{height:3px;background:var(--border);border-radius:2px;margin-bottom:6px;overflow:hidden}
.bar-fill{height:100%;border-radius:2px;transition:width .8s cubic-bezier(.4,0,.2,1)}
.cat-vals{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);font-family:'DM Mono',monospace}

/* INSIGHTS */
.insights{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.insight{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px}
.insight-tag{font-size:9px;font-weight:800;letter-spacing:1px;text-transform:uppercase;margin-bottom:8px;display:inline-block;padding:2px 8px;border-radius:4px}
.tag-green{background:#00d68f18;color:var(--green)}
.tag-yellow{background:#ffb62718;color:var(--yellow)}
.tag-red{background:#ff4d4d18;color:var(--red)}
.tag-blue{background:#4d9fff18;color:var(--blue)}
.insight h4{font-size:12px;font-weight:700;margin-bottom:5px;line-height:1.3}
.insight p{font-size:11px;color:var(--muted);line-height:1.5}

/* TRANSACTIONS */
.tx-item{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px 14px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.tx-desc{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:180px}
.tx-meta{display:flex;align-items:center;gap:5px;margin-top:3px;font-size:11px;color:var(--muted)}
.tx-valor{font-size:13px;font-weight:700;font-family:'DM Mono',monospace;text-align:right;margin-bottom:4px}
.badge{font-size:9px;padding:2px 7px;border-radius:4px;font-weight:700;letter-spacing:.3px}
.badge-alex{background:#0d2a47;color:#5ba3f5}
.badge-natalia{background:#2a1a00;color:#ffb627}
.badge-casal{background:#1e1e24;color:#666}

/* COLORS */
.green{color:var(--green)} .yellow{color:var(--yellow)} .red{color:var(--red)} .blue{color:var(--blue)}

/* LOADING / ERROR */
.loading{text-align:center;padding:60px 20px;color:var(--muted)}
.spinner{width:32px;height:32px;border:2px solid var(--border);border-top-color:var(--green);border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 16px}
.error{background:#1a0000;border:1px solid #3a0000;border-radius:12px;padding:16px;color:var(--red);font-size:13px;margin:16px 0}
@keyframes spin{to{transform:rotate(360deg)}}

.footer{text-align:center;font-size:11px;color:var(--dim);padding-top:16px}

/* Legend */
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px}
.leg-item{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--muted)}
.leg-dot{width:8px;height:8px;border-radius:2px;flex-shrink:0}
</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <div class="header-top">
      <div>
        <h1>Controle Financeiro</h1>
        <p id="subtitulo">Alex & Natalia · Campo Grande/MS</p>
      </div>
      <button class="btn-refresh" onclick="loadData()" id="btn-ref">↻ Atualizar</button>
    </div>
  </div>

  <div id="content"><div class="loading"><div class="spinner"></div>Carregando dados...</div></div>
  <p class="footer" id="footer-txt"></p>
</div>

<script>
const WEBHOOK = "https://alexviniciuss.app.n8n.cloud/webhook/dashboard-financeiro";

const ORC = {
  'Moradia':4263,'Transporte':789,'Alimentação':2350,
  'Saúde & Fitness':688,'Pets':350,'Pessoal & Beleza':485,
  'Comunicação':220,'Educação':693,'Fé & Comunidade':861,
  'Assinaturas':260,'Lazer & Variável':600,'Outros':200
};

const CAT_COLORS = ['#00d68f','#4d9fff','#ffb627','#ff4d4d','#a78bfa','#fb923c','#34d399','#60a5fa','#fbbf24','#f87171','#c084fc','#94a3b8'];
const MESES_PT = ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];

const brl = n => 'R$ ' + Math.abs(n||0).toLocaleString('pt-BR',{minimumFractionDigits:0,maximumFractionDigits:0});
const brlK = n => n>=1000?'R$ '+Math.round(n/1000)+'k':brl(n);

let currentTab = 'mensal';
let rawData = null;
let charts = {};

async function loadData() {
  document.getElementById('btn-ref').textContent = '↻ ...';
  try {
    const r = await fetch(WEBHOOK);
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    rawData = await r.json();
    render();
  } catch(e) {
    document.getElementById('content').innerHTML = `<div class="error">⚠ Erro: ${e.message}<br><small>Verifique se o workflow está publicado.</small></div>`;
  } finally {
    document.getElementById('btn-ref').textContent = '↻ Atualizar';
  }
}

function destroyCharts() {
  Object.values(charts).forEach(c => c.destroy());
  charts = {};
}

function processData() {
  const {renda, mesAtual, lancamentos} = rawData;
  const ano = mesAtual.slice(0,4);

  // Group by month
  const porMes = {};
  for (const l of lancamentos) {
    if (!l.mes || !l.mes.startsWith(ano)) continue;
    if (!porMes[l.mes]) porMes[l.mes] = {despesa:0, lancamentos:[]};
    porMes[l.mes].despesa += l.valor;
    porMes[l.mes].lancamentos.push(l);
  }

  // Months with data
  const mesesComDados = Object.keys(porMes).sort();
  const nMeses = mesesComDados.length || 1;

  // Annual totals
  const despesaTotal = Object.values(porMes).reduce((a,m) => a+m.despesa, 0);
  const receitaTotal = renda * nMeses;
  const saldoTotal = receitaTotal - despesaTotal;
  const margem = Math.round((saldoTotal/receitaTotal)*100);

  // Monthly series (Jan-Dez)
  const serieReceita = [], serieDespesa = [], serieSaldo = [], serieMeses = [];
  let saldoAcum = 0;
  for (let m=1; m<=12; m++) {
    const k = `${ano}-${String(m).padStart(2,'0')}`;
    const hasDados = !!porMes[k];
    const d = porMes[k]?.despesa || 0;
    const r2 = hasDados ? renda : 0;
    saldoAcum += hasDados ? (r2 - d) : 0;
    if (hasDados || k <= mesAtual) {
      serieMeses.push(MESES_PT[m-1]);
      serieReceita.push(hasDados ? r2 : 0);
      serieDespesa.push(Math.round(d));
      serieSaldo.push(hasDados ? Math.round(r2-d) : 0);
    }
  }

  // Current month
  const dadosMes = porMes[mesAtual] || {despesa:0, lancamentos:[]};
  const gastoCorrente = dadosMes.despesa;
  const surplus = renda - gastoCorrente;
  const pctGasto = Math.round((gastoCorrente/renda)*100);

  // Category breakdown (annual)
  const catAnual = {};
  for (const l of lancamentos) {
    if (!l.mes.startsWith(ano)) continue;
    catAnual[l.categoria] = (catAnual[l.categoria]||0) + l.valor;
  }

  // Category current month
  const catMes = {};
  for (const l of dadosMes.lancamentos||[]) {
    catMes[l.categoria] = (catMes[l.categoria]||0) + l.valor;
  }

  // Monthly table
  const tabelaMeses = mesesComDados.map(k => {
    const m = parseInt(k.slice(5))-1;
    const row = {mes: MESES_PT[m], total: Math.round(porMes[k].despesa), cats: {}};
    for (const l of porMes[k].lancamentos) {
      row.cats[l.categoria] = (row.cats[l.categoria]||0) + l.valor;
    }
    return row;
  });

  // Top 4 categories for table
  const top4 = Object.entries(catAnual).sort((a,b)=>b[1]-a[1]).slice(0,4).map(e=>e[0]);

  // Insights
  const insights = buildInsights({despesaTotal, receitaTotal, saldoTotal, margem, catAnual, catMes, gastoCorrente, renda, nMeses, tabelaMeses});

  return {renda, mesAtual, ano, nMeses, despesaTotal, receitaTotal, saldoTotal, margem,
          serieReceita, serieDespesa, serieSaldo, serieMeses,
          gastoCorrente, surplus, pctGasto, catAnual, catMes,
          tabelaMeses, top4, insights,
          recentes: (dadosMes.lancamentos||[]).slice().sort((a,b)=>b.data.localeCompare(a.data)).slice(0,25)};
}

function buildInsights({despesaTotal,receitaTotal,saldoTotal,margem,catAnual,catMes,gastoCorrente,renda,nMeses,tabelaMeses}) {
  const ins = [];
  // Margem
  if (margem >= 30) ins.push({tag:'green',label:'POUPANÇA SAUDÁVEL',title:`Margem de ${margem}%`,body:`Vocês estão acima da meta de 30%. ${brl(saldoTotal)} acumulado no período.`});
  else if (margem >= 15) ins.push({tag:'yellow',label:'ATENÇÃO',title:`Margem de ${margem}%`,body:`Abaixo da meta de 30%. Avaliar cortes para aumentar reserva.`});
  else ins.push({tag:'red',label:'RISCO',title:`Margem de ${margem}%`,body:`Margem crítica. Revisar despesas com urgência.`});

  // Maior categoria
  const topCat = Object.entries(catAnual).sort((a,b)=>b[1]-a[1])[0];
  if (topCat) {
    const pct = Math.round((topCat[1]/despesaTotal)*100);
    ins.push({tag:'blue',label:'MAIOR DESPESA',title:`${topCat[0]} (${pct}%)`,body:`${brl(topCat[1])} no período — ${brl(Math.round(topCat[1]/nMeses))}/mês em média.`});
  }

  // Consistência
  if (tabelaMeses.length >= 2) {
    const vals = tabelaMeses.map(m=>m.total);
    const min = Math.min(...vals), max = Math.max(...vals);
    const variacao = max - min;
    if (variacao < 2000) ins.push({tag:'green',label:'CONSISTÊNCIA',title:`Variação de ${brl(variacao)}`,body:`Despesas previsíveis entre ${brl(min)} e ${brl(max)}.`});
    else ins.push({tag:'yellow',label:'VARIABILIDADE',title:`Variação de ${brl(variacao)}`,body:`Mês mais caro foi ${brl(max)}, mais barato ${brl(min)}.`});
  }

  // Mês corrente
  const pct = Math.round((gastoCorrente/renda)*100);
  if (pct > 90) ins.push({tag:'red',label:'MÊS ATUAL',title:`${pct}% usado`,body:`Restam apenas ${brl(renda-gastoCorrente)} de margem este mês.`});
  else if (pct > 70) ins.push({tag:'yellow',label:'MÊS ATUAL',title:`${pct}% usado`,body:`${brl(gastoCorrente)} gastos. Restam ${brl(renda-gastoCorrente)}.`});
  else ins.push({tag:'green',label:'MÊS ATUAL',title:`${pct}% usado`,body:`Mês em dia. ${brl(renda-gastoCorrente)} disponíveis.`});

  return ins.slice(0,4);
}

function render() {
  destroyCharts();
  const d = processData();
  const mesNome = MESES_PT[parseInt(d.mesAtual.slice(5))-1]+'/'+d.mesAtual.slice(2,4);

  document.getElementById('subtitulo').textContent = `Alex & Natalia · ${d.ano}`;
  document.getElementById('footer-txt').textContent = `Atualizado ${rawData.atualizadoEm} · ${d.recentes.length} lançamentos`;

  const pctColor = d.pctGasto>=90?'red':d.pctGasto>=70?'yellow':'green';

  let html = `
    <div class="saldo-destaque">
      <div>
        <div class="saldo-label">Saldo acumulado ${d.ano}</div>
        <div class="saldo-val">${brl(d.saldoTotal)}</div>
        <div class="saldo-sub">${d.nMeses} ${d.nMeses===1?'mês':'meses'} positivos</div>
      </div>
      <div style="text-align:right">
        <div style="font-size:10px;color:var(--muted);margin-bottom:4px">MARGEM</div>
        <div style="font-size:24px;font-weight:700;color:var(--${d.margem>=30?'green':d.margem>=15?'yellow':'red'});font-family:'DM Mono',monospace">${d.margem}%</div>
        <div style="font-size:10px;color:var(--muted)">meta: >30%</div>
      </div>
    </div>

    <div class="kpis">
      <div class="kpi"><div class="kpi-label">Receita Total</div><div class="kpi-value">${brlK(d.receitaTotal)}</div><div class="kpi-sub">R$${(d.rawData?.renda||14224).toLocaleString('pt-BR')}/mês × ${d.nMeses}</div></div>
      <div class="kpi"><div class="kpi-label">Despesa Total</div><div class="kpi-value ${d.margem<15?'red':''}">${brlK(d.despesaTotal)}</div><div class="kpi-sub">média ${brlK(Math.round(d.despesaTotal/d.nMeses))}/mês</div></div>
      <div class="kpi"><div class="kpi-label">Gasto ${mesNome}</div><div class="kpi-value ${pctColor}">${brlK(d.gastoCorrente)}</div><div class="kpi-sub">${d.pctGasto}% da renda</div></div>
      <div class="kpi"><div class="kpi-label">Surplus ${mesNome}</div><div class="kpi-value green">${brlK(d.surplus)}</div><div class="kpi-sub">p/ investir</div></div>
    </div>

    <div class="tabs">
      <button class="tab ${currentTab==='mensal'?'active':''}" onclick="switchTab('mensal')">MÊS ATUAL</button>
      <button class="tab ${currentTab==='anual'?'active':''}" onclick="switchTab('anual')">ANO ${d.ano}</button>
      <button class="tab ${currentTab==='transacoes'?'active':''}" onclick="switchTab('transacoes')">LANÇAMENTOS</button>
    </div>`;

  if (currentTab === 'mensal') {
    html += renderMensal(d, mesNome);
  } else if (currentTab === 'anual') {
    html += renderAnual(d);
  } else {
    html += renderTransacoes(d);
  }

  document.getElementById('content').innerHTML = html;

  if (currentTab === 'anual') {
    renderCharts(d);
  }
}

function renderMensal(d, mesNome) {
  const cats = Object.keys(ORC).map(nome => {
    const gasto = d.catMes[nome]||0;
    const orc = ORC[nome];
    const pct = Math.round((gasto/orc)*100);
    return {nome, gasto, orc, pct};
  }).filter(c => c.gasto > 0).sort((a,b)=>b.gasto-a.gasto);

  let html = `<div class="section"><div class="section-title">Categorias — ${mesNome}</div>`;
  for (const c of cats) {
    const color = c.pct>=100?'red':c.pct>=80?'yellow':'green';
    html += `<div class="cat-item">
      <div class="cat-row">
        <div class="cat-name"><div class="cat-dot" style="background:var(--${color})"></div>${c.nome}</div>
        <div class="cat-pct ${color}">${c.pct}%</div>
      </div>
      <div class="bar-bg"><div class="bar-fill" style="width:${Math.min(c.pct,100)}%;background:var(--${color})"></div></div>
      <div class="cat-vals"><span>${brl(c.gasto)}</span><span>/ ${brl(c.orc)}</span></div>
    </div>`;
  }
  if (cats.length === 0) html += `<div style="color:var(--muted);text-align:center;padding:24px;font-size:13px">Nenhum lançamento este mês ainda.</div>`;
  html += '</div>';

  html += `<div class="section"><div class="section-title">Principais Insights</div><div class="insights">`;
  for (const ins of d.insights) {
    html += `<div class="insight"><span class="insight-tag tag-${ins.tag}">${ins.label}</span><h4>${ins.title}</h4><p>${ins.body}</p></div>`;
  }
  html += '</div></div>';
  return html;
}

function renderAnual(d) {
  let html = `<div class="section"><div class="section-title">Receita vs Despesa</div>
    <div class="chart-card">
      <h3>Evolução mensal — ${d.ano}</h3>
      <div class="chart-wrap"><canvas id="chart-mensal"></canvas></div>
      <div class="legend">
        <div class="leg-item"><div class="leg-dot" style="background:var(--green)"></div>Renda</div>
        <div class="leg-item"><div class="leg-dot" style="background:var(--red)"></div>Despesa</div>
        <div class="leg-item"><div class="leg-dot" style="background:var(--blue)"></div>Saldo</div>
      </div>
    </div>
  </div>`;

  // Monthly table
  if (d.tabelaMeses.length > 0) {
    html += `<div class="section"><div class="section-title">Demonstrativo por Mês</div>
      <div class="tbl-wrap"><div class="tbl-scroll"><table>
        <thead><tr><th>MÊS</th>`;
    for (const cat of d.top4) html += `<th>${cat.split(' ')[0].toUpperCase()}</th>`;
    html += `<th>TOTAL</th></tr></thead><tbody>`;
    for (const row of d.tabelaMeses) {
      html += `<tr><td>${row.mes}</td>`;
      for (const cat of d.top4) html += `<td>${row.cats[cat]?brlK(row.cats[cat]):'-'}</td>`;
      html += `<td>${brl(row.total)}</td></tr>`;
    }
    // Total row
    html += `<tr><td>Total</td>`;
    for (const cat of d.top4) {
      const tot = d.tabelaMeses.reduce((a,r)=>a+(r.cats[cat]||0),0);
      html += `<td>${brlK(tot)}</td>`;
    }
    html += `<td>${brl(d.despesaTotal)}</td></tr>`;
    html += `</tbody></table></div></div></div>`;
  }

  // Category breakdown
  const catSort = Object.entries(d.catAnual).sort((a,b)=>b[1]-a[1]);
  html += `<div class="section"><div class="section-title">Despesas por Categoria</div>`;
  catSort.forEach(([nome, val], i) => {
    const pct = Math.round((val/d.despesaTotal)*100);
    html += `<div class="cat-item">
      <div class="cat-row">
        <div class="cat-name"><div class="cat-dot" style="background:${CAT_COLORS[i%CAT_COLORS.length]}"></div>${nome}</div>
        <div class="cat-pct" style="color:${CAT_COLORS[i%CAT_COLORS.length]}">${pct}%</div>
      </div>
      <div class="bar-bg"><div class="bar-fill" style="width:${pct}%;background:${CAT_COLORS[i%CAT_COLORS.length]}"></div></div>
      <div class="cat-vals"><span>${brl(val)}</span><span>${brl(Math.round(val/d.nMeses))}/mês</span></div>
    </div>`;
  });
  html += '</div>';

  html += `<div class="section"><div class="section-title">Insights ${d.ano}</div><div class="insights">`;
  for (const ins of d.insights) {
    html += `<div class="insight"><span class="insight-tag tag-${ins.tag}">${ins.label}</span><h4>${ins.title}</h4><p>${ins.body}</p></div>`;
  }
  html += '</div></div>';
  return html;
}

function renderTransacoes(d) {
  let html = `<div class="section"><div class="section-title">Lançamentos recentes</div>`;
  for (const t of d.recentes) {
    const badge = t.quem==='Alex'?'badge-alex':t.quem==='Natalia'?'badge-natalia':'badge-casal';
    const dia = t.data?t.data.slice(8)+'/'+t.data.slice(5,7):'';
    html += `<div class="tx-item">
      <div style="flex:1;min-width:0">
        <div class="tx-desc">${t.descricao||'—'}</div>
        <div class="tx-meta"><span>${dia}</span><span>·</span><span>${t.categoria}</span></div>
      </div>
      <div style="text-align:right;flex-shrink:0">
        <div class="tx-valor">${brl(t.valor)}</div>
        <span class="badge ${badge}">${t.quem||'Casal'}</span>
      </div>
    </div>`;
  }
  if (d.recentes.length === 0) html += `<div style="color:var(--muted);text-align:center;padding:24px;font-size:13px">Nenhum lançamento encontrado.</div>`;
  html += '</div>';
  return html;
}

function renderCharts(d) {
  const cfgBar = {
    type:'bar',
    data:{
      labels: d.serieMeses,
      datasets:[
        {label:'Renda',data:d.serieReceita,backgroundColor:'#00d68f40',borderColor:'#00d68f',borderWidth:1.5,borderRadius:4},
        {label:'Despesa',data:d.serieDespesa,backgroundColor:'#ff4d4d40',borderColor:'#ff4d4d',borderWidth:1.5,borderRadius:4},
        {label:'Saldo',data:d.serieSaldo,backgroundColor:'#4d9fff40',borderColor:'#4d9fff',borderWidth:1.5,borderRadius:4}
      ]
    },
    options:{
      responsive:true,maintainAspectRatio:false,
      plugins:{legend:{display:false},tooltip:{callbacks:{label:ctx=>' '+brl(ctx.raw)}}},
      scales:{
        x:{grid:{color:'#242428'},ticks:{color:'#7a7a8a',font:{size:10}}},
        y:{grid:{color:'#242428'},ticks:{color:'#7a7a8a',font:{size:10},callback:v=>brlK(v)}}
      }
    }
  };

  const ctx = document.getElementById('chart-mensal');
  if (ctx) charts['mensal'] = new Chart(ctx, cfgBar);
}

function switchTab(tab) {
  currentTab = tab;
  render();
}

loadData();
setInterval(loadData, 5*60*1000);
</script>
</body>
</html>
