<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Controle Financeiro — Alex & Natalia</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@400;500&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #080b10;
  --s1: #0e1420;
  --s2: #141c2e;
  --s3: #1c2640;
  --border: #1e2d47;
  --green: #0dff8c;
  --green2: #00c97a;
  --yellow: #f5c542;
  --red: #ff4f6d;
  --blue: #3d8ef8;
  --purple: #a78bfa;
  --text: #e8edf5;
  --muted: #6b7fa3;
  --dim: #2d3f5e;
  --mono: 'DM Mono', monospace;
  --sans: 'Inter', sans-serif;
  --display: 'Syne', sans-serif;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--sans);
  min-height: 100vh;
  background-image:
    radial-gradient(ellipse 80% 50% at 20% -10%, #0d2040 0%, transparent 60%),
    radial-gradient(ellipse 60% 40% at 80% 100%, #0a1f35 0%, transparent 50%);
}

/* LAYOUT */
.wrap { max-width: 1280px; margin: 0 auto; padding: 28px 24px 60px; }
@media(max-width:768px){ .wrap{ padding: 16px 14px 48px; } }

/* HEADER */
.header {
  display: flex; align-items: flex-start; justify-content: space-between;
  margin-bottom: 32px; gap: 16px; flex-wrap: wrap;
}
.header-title { font-family: var(--display); font-size: clamp(22px,3vw,32px); font-weight: 800; letter-spacing: -1px; }
.header-title span { color: var(--green); }
.header-sub { font-size: 12px; color: var(--muted); margin-top: 4px; letter-spacing: .5px; }
.header-actions { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.btn {
  background: var(--s2); border: 1px solid var(--border); color: var(--muted);
  padding: 9px 16px; border-radius: 10px; cursor: pointer; font-size: 12px;
  font-family: var(--sans); font-weight: 500; letter-spacing: .4px;
  transition: all .2s; display: flex; align-items: center; gap: 6px;
}
.btn:hover { color: var(--text); border-color: var(--dim); background: var(--s3); }
.btn-primary { background: var(--green2); color: #000; border-color: var(--green2); font-weight: 600; }
.btn-primary:hover { background: var(--green); color: #000; border-color: var(--green); }
.spin { animation: spin .8s linear infinite; display: inline-block; }
@keyframes spin { to { transform: rotate(360deg); } }

/* SALDO HERO */
.hero {
  background: linear-gradient(135deg, #0a1f35 0%, #0d2a45 50%, #081828 100%);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 28px 32px;
  margin-bottom: 24px;
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 24px;
  align-items: center;
  position: relative;
  overflow: hidden;
}
.hero::before {
  content: '';
  position: absolute;
  top: -40px; right: -40px;
  width: 200px; height: 200px;
  background: radial-gradient(circle, #0dff8c15 0%, transparent 70%);
  pointer-events: none;
}
.hero-label { font-size: 10px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; color: var(--green); margin-bottom: 6px; }
.hero-val { font-family: var(--display); font-size: clamp(32px,5vw,52px); font-weight: 800; color: var(--green); letter-spacing: -2px; line-height: 1; }
.hero-sub { font-size: 12px; color: var(--muted); margin-top: 6px; }
.hero-right { text-align: right; }
.hero-margem-label { font-size: 10px; color: var(--muted); letter-spacing: 1px; text-transform: uppercase; margin-bottom: 4px; }
.hero-margem { font-family: var(--display); font-size: clamp(28px,4vw,42px); font-weight: 800; letter-spacing: -1px; }
.hero-meta { font-size: 11px; color: var(--muted); margin-top: 4px; }
@media(max-width:600px){ .hero{ grid-template-columns:1fr; } .hero-right{ text-align:left; } }

/* KPI GRID */
.kpi-grid { display: grid; grid-template-columns: repeat(4,1fr); gap: 14px; margin-bottom: 28px; }
@media(max-width:900px){ .kpi-grid{ grid-template-columns: repeat(2,1fr); } }
@media(max-width:480px){ .kpi-grid{ grid-template-columns: 1fr 1fr; gap:10px; } }
.kpi {
  background: var(--s1); border: 1px solid var(--border); border-radius: 16px;
  padding: 18px 20px; transition: border-color .2s;
}
.kpi:hover { border-color: var(--dim); }
.kpi-label { font-size: 10px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }
.kpi-val { font-family: var(--display); font-size: clamp(18px,2.5vw,24px); font-weight: 700; letter-spacing: -0.5px; }
.kpi-sub { font-size: 11px; color: var(--muted); margin-top: 4px; }

/* TABS */
.tabs-wrap { margin-bottom: 24px; }
.tabs {
  display: inline-flex; background: var(--s1); border: 1px solid var(--border);
  border-radius: 12px; padding: 4px; gap: 3px;
}
.tab {
  padding: 9px 20px; font-size: 12px; font-weight: 600; font-family: var(--sans);
  letter-spacing: .5px; border-radius: 9px; cursor: pointer; color: var(--muted);
  border: none; background: transparent; transition: all .2s; white-space: nowrap;
}
.tab.active { background: var(--s3); color: var(--text); border: 1px solid var(--border); }
@media(max-width:480px){ .tab{ padding: 8px 12px; font-size:11px; } }

/* SECTION TITLE */
.sec-title {
  font-size: 10px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase;
  color: var(--muted); margin-bottom: 14px; display: flex; align-items: center; gap: 10px;
}
.sec-title::after { content:''; flex:1; height:1px; background: var(--border); }

/* CONTENT GRID */
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; }
@media(max-width:900px){ .grid-2,.grid-3{ grid-template-columns:1fr; } }

/* CARD */
.card {
  background: var(--s1); border: 1px solid var(--border);
  border-radius: 16px; padding: 20px 22px; overflow: hidden;
}
.card h3 { font-size: 12px; font-weight: 600; color: var(--muted); margin-bottom: 16px; letter-spacing: .4px; }
.chart-wrap { position: relative; }
.chart-h180 { height: 180px; }
.chart-h220 { height: 220px; }
.chart-h260 { height: 260px; }

/* CAT BARS */
.cat-item { margin-bottom: 12px; }
.cat-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px; }
.cat-name { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 500; }
.cat-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
.cat-pct { font-family: var(--mono); font-size: 12px; font-weight: 600; }
.bar-bg { height: 3px; background: var(--border); border-radius: 2px; overflow: hidden; }
.bar-fill { height: 100%; border-radius: 2px; transition: width 1s cubic-bezier(.4,0,.2,1); }
.cat-vals { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); font-family: var(--mono); margin-top: 4px; }

/* INSIGHTS */
.insights-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 12px; margin-bottom: 24px; }
@media(max-width:900px){ .insights-grid{ grid-template-columns: 1fr 1fr; } }
@media(max-width:480px){ .insights-grid{ grid-template-columns: 1fr; } }
.insight {
  background: var(--s1); border: 1px solid var(--border); border-radius: 14px; padding: 16px 18px;
  transition: border-color .2s;
}
.insight:hover { border-color: var(--dim); }
.insight-tag {
  font-size: 9px; font-weight: 800; letter-spacing: 1.2px; text-transform: uppercase;
  padding: 3px 8px; border-radius: 4px; display: inline-block; margin-bottom: 8px;
}
.tag-g { background: #0dff8c18; color: var(--green); }
.tag-y { background: #f5c54218; color: var(--yellow); }
.tag-r { background: #ff4f6d18; color: var(--red); }
.tag-b { background: #3d8ef818; color: var(--blue); }
.insight h4 { font-size: 13px; font-weight: 600; margin-bottom: 5px; line-height: 1.3; }
.insight p { font-size: 11px; color: var(--muted); line-height: 1.6; }

/* TRANSACTIONS */
.tx-item {
  display: flex; justify-content: space-between; align-items: flex-start; gap: 12px;
  padding: 11px 0; border-bottom: 1px solid var(--border);
}
.tx-item:last-child { border-bottom: none; }
.tx-desc { font-size: 13px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 200px; }
.tx-meta { font-size: 11px; color: var(--muted); margin-top: 3px; display: flex; gap: 6px; align-items: center; }
.tx-val { font-family: var(--mono); font-size: 13px; font-weight: 600; text-align: right; white-space: nowrap; }
.badge { font-size: 9px; padding: 2px 7px; border-radius: 4px; font-weight: 700; letter-spacing: .3px; }
.ba { background: #0d2a47; color: #5ba3f5; }
.bn { background: #2a1a00; color: #f5c542; }
.bc { background: #1a2030; color: #6b7fa3; }

/* TABLE */
.tbl-wrap { overflow-x: auto; border-radius: 12px; border: 1px solid var(--border); }
table { width: 100%; border-collapse: collapse; font-size: 12px; font-family: var(--mono); }
thead th { background: var(--s2); padding: 10px 12px; text-align: right; font-size: 9px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: var(--muted); white-space: nowrap; }
thead th:first-child { text-align: left; }
tbody td { padding: 9px 12px; text-align: right; border-top: 1px solid var(--border); }
tbody td:first-child { text-align: left; color: var(--muted); font-size: 11px; }
tbody tr:last-child td { font-weight: 700; background: var(--s2); }
tbody tr:hover td { background: #ffffff05; }

/* WISHLIST */
.wish-item {
  background: var(--s1); border: 1px solid var(--border); border-radius: 14px;
  padding: 16px 18px; margin-bottom: 10px; display: flex; justify-content: space-between;
  align-items: center; gap: 16px; flex-wrap: wrap; transition: border-color .2s;
}
.wish-item:hover { border-color: var(--dim); }
.wish-name { font-size: 14px; font-weight: 600; margin-bottom: 4px; }
.wish-meta { font-size: 11px; color: var(--muted); display: flex; gap: 10px; flex-wrap: wrap; }
.wish-val { font-family: var(--display); font-size: 20px; font-weight: 700; text-align: right; white-space: nowrap; }
.wish-impact { font-size: 11px; color: var(--muted); text-align: right; margin-top: 2px; }
.prio-alta { border-left: 3px solid var(--red); }
.prio-media { border-left: 3px solid var(--yellow); }
.prio-baixa { border-left: 3px solid var(--blue); }
.wish-total {
  background: var(--s2); border: 1px solid var(--border); border-radius: 14px;
  padding: 16px 20px; display: flex; justify-content: space-between; align-items: center; margin-top: 16px;
}
.legend { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 10px; }
.leg { display: flex; align-items: center; gap: 5px; font-size: 11px; color: var(--muted); }
.leg-dot { width: 8px; height: 8px; border-radius: 2px; }

/* PROJ BADGE */
.proj-badge { font-size: 9px; padding: 2px 6px; background: #3d8ef818; color: var(--blue); border-radius: 3px; font-weight: 700; letter-spacing: .5px; margin-left: 6px; }

/* COLORS */
.green { color: var(--green); } .yellow { color: var(--yellow); } .red { color: var(--red); } .blue { color: var(--blue); }

/* LOADING */
.loading { text-align: center; padding: 80px 20px; color: var(--muted); }
.loader { width: 36px; height: 36px; border: 2px solid var(--border); border-top-color: var(--green); border-radius: 50%; animation: spin .8s linear infinite; margin: 0 auto 16px; }
.error-box { background: #1a0010; border: 1px solid #3a0020; border-radius: 12px; padding: 16px; color: var(--red); font-size: 13px; margin: 16px 0; }

.footer { text-align: center; font-size: 11px; color: var(--dim); padding-top: 24px; }

/* GAP */
.mb16 { margin-bottom: 16px; }
.mb24 { margin-bottom: 24px; }

/* DRILL-DOWN */
.cat-item { cursor: pointer; border-radius: 10px; padding: 6px 8px; margin: 0 -8px 6px; transition: background .15s; }
.cat-item:hover { background: var(--s2); }
.cat-item.open { background: var(--s2); }
.cat-toggle { float: right; font-size: 10px; color: var(--muted); margin-left: 6px; transition: transform .2s; }
.cat-item.open .cat-toggle { transform: rotate(180deg); }
.cat-drill {
  max-height: 0; overflow: hidden;
  transition: max-height .35s cubic-bezier(.4,0,.2,1);
  border-top: 0px solid var(--border);
}
.cat-drill.open {
  max-height: 600px;
  border-top: 1px solid var(--border);
  margin-top: 8px;
  padding-top: 6px;
}
.drill-row {
  display: flex; justify-content: space-between; align-items: center;
  padding: 6px 2px; border-bottom: 1px solid var(--border); gap: 10px;
}
.drill-row:last-child { border-bottom: none; }
.drill-desc { font-size: 12px; color: var(--text); flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.drill-date { font-size: 11px; color: var(--muted); font-family: var(--mono); flex-shrink: 0; }
.drill-val { font-size: 12px; font-weight: 600; font-family: var(--mono); flex-shrink: 0; }
.drill-who { font-size: 10px; padding: 1px 6px; border-radius: 3px; flex-shrink: 0; }
</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <div>
      <div class="header-title">Controle <span>Financeiro</span></div>
      <div class="header-sub" id="header-sub">Alex & Natalia · Campo Grande/MS · 2026</div>
    </div>
    <div class="header-actions">
      <button class="btn" onclick="loadData()" id="btn-ref">↻ Atualizar</button>
    </div>
  </div>
  <div id="content"><div class="loading"><div class="loader"></div>Carregando dados...</div></div>
  <div class="footer" id="footer"></div>
</div>

<script>
const WEBHOOK = "https://alexviniciuss.app.n8n.cloud/webhook/dashboard-financeiro";

// ═══════════════════════════════════════════════
// LISTA DE DESEJOS — edite aqui para adicionar itens
// ═══════════════════════════════════════════════
const DESEJOS = [
  { nome: 'Notebook novo', valor: 4500, prioridade: 'alta', obs: 'Substituir notebook atual' },
  { nome: 'TV sala', valor: 3200, prioridade: 'media', obs: 'TV 55" 4K' },
  { nome: 'Ar condicionado', valor: 2800, prioridade: 'alta', obs: 'Quarto principal' },
  { nome: 'Câmera fotográfica', valor: 2500, prioridade: 'baixa', obs: 'Hobby / viagens' },
  { nome: 'Bicicleta elétrica', valor: 3800, prioridade: 'baixa', obs: 'Lazer e deslocamento' },
];

const ORC = {
  'Moradia':4263,'Transporte':789,'Alimentação':1600,
  'Saúde & Fitness':700,'Pets':350,'Pessoal & Beleza':510,
  'Comunicação':220,'Educação':693,'Fé & Comunidade':892,
  'Assinaturas':210,'Lazer & Variável':600,'Outros':200
};
const RENDA = 14224;
const ANO_BASE = '2026';
const MES_INICIO = '2026-06'; // Mês que começamos a controlar

const MESES_PT = ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
const CAT_CORES = ['#0dff8c','#3d8ef8','#f5c542','#ff4f6d','#a78bfa','#fb923c','#34d399','#60a5fa','#fbbf24','#f87171','#c084fc','#94a3b8'];

const brl = n => 'R$ ' + Math.abs(n||0).toLocaleString('pt-BR',{minimumFractionDigits:0,maximumFractionDigits:0});
const brlK = n => Math.abs(n)>=1000?'R$ '+(Math.abs(n)/1000).toFixed(1).replace('.0','')+'k':brl(n);
const pctColor = p => p>=100?'red':p>=80?'yellow':'green';

let tab = 'mensal';
let raw = null;
let charts = {};

async function loadData() {
  const btn = document.getElementById('btn-ref');
  btn.innerHTML = '<span class="spin">↻</span> Carregando';
  try {
    const r = await fetch(WEBHOOK);
    if(!r.ok) throw new Error('HTTP '+r.status);
    raw = await r.json();
    render();
  } catch(e) {
    document.getElementById('content').innerHTML = `<div class="error-box">⚠ Erro ao carregar: ${e.message}<br><small>Verifique se o workflow está publicado.</small></div>`;
  } finally {
    btn.innerHTML = '↻ Atualizar';
  }
}

function destroyCharts() { Object.values(charts).forEach(c=>c.destroy()); charts={}; }

function processData() {
  const {lancamentos} = raw;

  // Agrupa por mês (apenas a partir de MES_INICIO)
  const porMes = {};
  for(const l of lancamentos) {
    if(!l.mes || l.mes < MES_INICIO) continue;
    if(!porMes[l.mes]) porMes[l.mes] = {despesa:0, itens:[]};
    porMes[l.mes].despesa += l.valor;
    porMes[l.mes].itens.push(l);
  }

  const hoje = new Date();
  const diaHoje = hoje.getDate();
  const mesRefHoje = diaHoje >= 25
    ? new Date(hoje.getFullYear(), hoje.getMonth()+1, 1)
    : hoje;
  const mesAtual = mesRefHoje.getFullYear()+'-'+String(mesRefHoje.getMonth()+1).padStart(2,'0');

  const mesesComDados = Object.keys(porMes).sort();
  const nMeses = mesesComDados.length || 1;

  // Totais anuais (apenas meses com dados reais)
  const despesaTotal = mesesComDados.reduce((a,m)=>a+porMes[m].despesa,0);
  const receitaTotal = RENDA * nMeses;
  const saldoTotal = receitaTotal - despesaTotal;
  const margem = receitaTotal>0 ? Math.round((saldoTotal/receitaTotal)*100) : 0;

  // Série mensal: meses reais + projeção até dezembro
  const serieLabels=[], serieReal=[], serieProj=[], serieAcum=[];
  let acum = 0;
  for(let m=parseInt(MES_INICIO.slice(5)); m<=12; m++) {
    const k = ANO_BASE+'-'+String(m).padStart(2,'0');
    const label = MESES_PT[m-1];
    const temDados = !!porMes[k];
    const despesa = temDados ? porMes[k].despesa : 0;
    const projecao = temDados ? 0 : Object.values(ORC).reduce((a,b)=>a+b,0);
    if(temDados) acum += RENDA - despesa;
    else if(k <= mesAtual) acum += 0;
    serieLabels.push(label);
    serieReal.push(temDados ? Math.round(despesa) : null);
    serieProj.push(!temDados && k > mesAtual ? Math.round(projecao) : null);
    serieAcum.push(temDados ? Math.round(acum) : null);
  }

  // Mês atual
  const dadosMes = porMes[mesAtual] || {despesa:0,itens:[]};
  const gastoMes = dadosMes.despesa;
  const surplusMes = RENDA - gastoMes;
  const pctMes = Math.round((gastoMes/RENDA)*100);

  // Categorias mês atual
  const catMes = {};
  for(const l of dadosMes.itens||[]) catMes[l.categoria] = (catMes[l.categoria]||0) + l.valor;

  // Categorias anuais
  const catAno = {};
  for(const l of lancamentos) {
    if(!l.mes||l.mes<MES_INICIO) continue;
    catAno[l.categoria] = (catAno[l.categoria]||0) + l.valor;
  }

  // Tabela por mês × top categorias
  const top4 = Object.entries(catAno).sort((a,b)=>b[1]-a[1]).slice(0,4).map(e=>e[0]);
  const tabelaMeses = mesesComDados.map(k=>{
    const m = parseInt(k.slice(5))-1;
    const cats = {};
    for(const l of porMes[k].itens) cats[l.categoria]=(cats[l.categoria]||0)+l.valor;
    return {label:MESES_PT[m], total:Math.round(porMes[k].despesa), cats};
  });

  const mesLabel = MESES_PT[parseInt(mesAtual.slice(5))-1]+'/'+mesAtual.slice(2,4);

  return {
    mesAtual, mesLabel, nMeses, margem,
    despesaTotal, receitaTotal, saldoTotal,
    gastoMes, surplusMes, pctMes,
    serieLabels, serieReal, serieProj, serieAcum,
    catMes, catAno, tabelaMeses, top4,
    recentes: (dadosMes.itens||[]).slice().sort((a,b)=>b.data.localeCompare(a.data))
  };
}

function render() {
  destroyCharts();
  const d = processData();
  const mc = d.margem>=30?'green':d.margem>=15?'yellow':'red';
  const pc = pctColor(d.pctMes);

  document.getElementById('header-sub').textContent = `Alex & Natalia · Campo Grande/MS · ${ANO_BASE}`;
  document.getElementById('footer').textContent = `Atualizado ${raw.atualizadoEm} · Período: jun/${ANO_BASE.slice(2)} em diante`;

  let html = `
  <div class="hero mb24">
    <div>
      <div class="hero-label">Saldo acumulado ${ANO_BASE}</div>
      <div class="hero-val">${brl(d.saldoTotal)}</div>
      <div class="hero-sub">${d.nMeses} ${d.nMeses===1?'mês':'meses'} de controle · ${brl(d.receitaTotal)} receita</div>
    </div>
    <div class="hero-right">
      <div class="hero-margem-label">Margem</div>
      <div class="hero-margem ${mc}">${d.margem}%</div>
      <div class="hero-meta">meta: &gt;30%</div>
    </div>
  </div>

  <div class="kpi-grid mb24">
    <div class="kpi">
      <div class="kpi-label">Receita Total</div>
      <div class="kpi-val">${brlK(d.receitaTotal)}</div>
      <div class="kpi-sub">${brl(RENDA)}/mês × ${d.nMeses}</div>
    </div>
    <div class="kpi">
      <div class="kpi-label">Despesa Total</div>
      <div class="kpi-val ${d.margem<15?'red':''}">${brlK(d.despesaTotal)}</div>
      <div class="kpi-sub">média ${brlK(Math.round(d.despesaTotal/d.nMeses))}/mês</div>
    </div>
    <div class="kpi">
      <div class="kpi-label">Gasto ${d.mesLabel}</div>
      <div class="kpi-val ${pc}">${brlK(d.gastoMes)}</div>
      <div class="kpi-sub">${d.pctMes}% da renda</div>
    </div>
    <div class="kpi">
      <div class="kpi-label">Surplus ${d.mesLabel}</div>
      <div class="kpi-val green">${brlK(d.surplusMes)}</div>
      <div class="kpi-sub">p/ investir</div>
    </div>
  </div>

  <div class="tabs-wrap mb24">
    <div class="tabs">
      <button class="tab ${tab==='mensal'?'active':''}" onclick="switchTab('mensal')">Mês Atual</button>
      <button class="tab ${tab==='anual'?'active':''}" onclick="switchTab('anual')">Ano ${ANO_BASE}</button>
      <button class="tab ${tab==='lancamentos'?'active':''}" onclick="switchTab('lancamentos')">Lançamentos</button>
      <button class="tab ${tab==='desejos'?'active':''}" onclick="switchTab('desejos')">Lista de Desejos</button>
    </div>
  </div>`;

  if(tab==='mensal') html += renderMensal(d);
  else if(tab==='anual') html += renderAnual(d);
  else if(tab==='lancamentos') html += renderLancamentos(d);
  else html += renderDesejos(d);

  document.getElementById('content').innerHTML = html;

  requestAnimationFrame(() => {
    if(tab==='mensal') buildChartsMensal(d);
    else if(tab==='anual') buildChartsAnual(d);
  });
}

// ─── MENSAL ──────────────────────────────────────
function toggleDrill(id) {
  const item = document.getElementById('ci-'+id);
  const drill = document.getElementById('cd-'+id);
  item.classList.toggle('open');
  drill.classList.toggle('open');
}

function renderMensal(d) {
  const cats = Object.keys(ORC).map(n=>({
    nome:n, gasto:d.catMes[n]||0, orc:ORC[n],
    pct: Math.round(((d.catMes[n]||0)/ORC[n])*100),
    itens: (d.recentes||[]).filter(l=>l.categoria===n)
  })).filter(c=>c.gasto>0).sort((a,b)=>b.gasto-a.gasto);

  let html = `<div class="grid-2 mb24">
    <div class="card">
      <h3>Gastos por categoria — ${d.mesLabel} <span style="color:var(--muted);font-weight:400;font-size:10px">(clique para ver lançamentos)</span></h3>`;

  for(const [i,c] of cats.entries()) {
    const id = c.nome.replace(/[^a-z]/gi,'').toLowerCase();
    const col = CAT_CORES[Object.keys(ORC).indexOf(c.nome)%CAT_CORES.length];
    const pc = c.pct>=100?'var(--red)':c.pct>=80?'var(--yellow)':col;
    const nItens = c.itens.length;

    html += `<div class="cat-item" id="ci-${id}" onclick="toggleDrill('${id}')">
      <div class="cat-row">
        <div class="cat-name"><div class="cat-dot" style="background:${col}"></div>${c.nome}
          <span style="font-size:10px;color:var(--muted)">(${nItens})</span>
        </div>
        <div style="display:flex;align-items:center;gap:8px">
          <div class="cat-pct" style="color:${pc}">${c.pct}%</div>
          <span class="cat-toggle">▾</span>
        </div>
      </div>
      <div class="bar-bg"><div class="bar-fill" style="width:${Math.min(c.pct,100)}%;background:${pc}"></div></div>
      <div class="cat-vals"><span>${brl(c.gasto)}</span><span>/ ${brl(c.orc)}</span></div>
      <div class="cat-drill" id="cd-${id}">`;

    if(nItens > 0) {
      for(const t of c.itens.sort((a,b)=>b.data.localeCompare(a.data))) {
        const dia = t.data?t.data.slice(8)+'/'+t.data.slice(5,7):'';
        const badge = t.quem==='Alex'?'ba':t.quem==='Natalia'?'bn':'bc';
        html += `<div class="drill-row">
          <div class="drill-desc">${t.descricao||'—'}</div>
          <div class="drill-date">${dia}</div>
          <div class="drill-val">${brl(t.valor)}</div>
          <span class="badge ${badge} drill-who">${t.quem||'Casal'}</span>
        </div>`;
      }
    } else {
      html += `<div style="font-size:11px;color:var(--muted);padding:8px 2px">Nenhum lançamento individual disponível.</div>`;
    }

    html += `</div></div>`;
  }

  if(!cats.length) html += `<div style="color:var(--muted);text-align:center;padding:32px;font-size:13px">Nenhum lançamento em ${d.mesLabel}</div>`;
  html += `</div>
    <div class="card">
      <h3>Distribuição ${d.mesLabel}</h3>
      <div class="chart-wrap chart-h220"><canvas id="chart-donut"></canvas></div>
    </div>
  </div>`;

  // Categorias ainda zeradas
  const zeradas = Object.keys(ORC).filter(n=>!d.catMes[n]);
  if(zeradas.length) {
    html += `<div class="card mb24"><h3>Categorias sem lançamento este mês</h3>
      <div style="display:flex;flex-wrap:wrap;gap:8px;padding-top:4px">`;
    for(const n of zeradas) {
      const col = CAT_CORES[Object.keys(ORC).indexOf(n)%CAT_CORES.length];
      html += `<span style="font-size:11px;padding:4px 10px;border-radius:6px;border:1px solid var(--border);color:var(--muted)">
        <span style="display:inline-block;width:6px;height:6px;border-radius:50%;background:${col};margin-right:5px"></span>${n} · ${brl(ORC[n])}
      </span>`;
    }
    html += `</div></div>`;
  }

  return html;
}

// ─── ANUAL ───────────────────────────────────────
function renderAnual(d) {
  let html = `
  <div class="card mb24">
    <h3>Evolução mensal + Projeção até dezembro
      <span class="proj-badge">PROJ</span>
    </h3>
    <div class="chart-wrap chart-h260"><canvas id="chart-barra"></canvas></div>
    <div class="legend" style="margin-top:12px">
      <div class="leg"><div class="leg-dot" style="background:var(--red)"></div>Despesa real</div>
      <div class="leg"><div class="leg-dot" style="background:#ff4f6d44"></div>Projeção</div>
      <div class="leg"><div class="leg-dot" style="background:var(--green)"></div>Saldo acumulado</div>
    </div>
  </div>`;

  if(d.tabelaMeses.length>0) {
    html += `<div class="mb24"><div class="sec-title">Demonstrativo mensal</div>
      <div class="tbl-wrap"><table><thead><tr><th>Mês</th>`;
    for(const c of d.top4) html += `<th>${c.split(' ')[0]}</th>`;
    html += `<th>Total</th><th>% Renda</th></tr></thead><tbody>`;
    for(const r of d.tabelaMeses) {
      const pct = Math.round((r.total/RENDA)*100);
      html += `<tr><td>${r.label}</td>`;
      for(const c of d.top4) html += `<td>${r.cats[c]?brlK(r.cats[c]):'-'}</td>`;
      html += `<td>${brl(r.total)}</td><td class="${pctColor(pct)}">${pct}%</td></tr>`;
    }
    const totTotal = d.tabelaMeses.reduce((a,r)=>a+r.total,0);
    html += `<tr><td>Total</td>`;
    for(const c of d.top4) {
      const t = d.tabelaMeses.reduce((a,r)=>a+(r.cats[c]||0),0);
      html += `<td>${brlK(t)}</td>`;
    }
    html += `<td>${brl(totTotal)}</td><td>${Math.round((totTotal/RENDA/d.nMeses)*100)}%</td></tr>`;
    html += `</tbody></table></div></div>`;
  }

  // Categorias anuais
  const catSort = Object.entries(d.catAno).sort((a,b)=>b[1]-a[1]);
  html += `<div class="grid-2 mb24">
    <div class="card">
      <h3>Despesas por categoria — ${ANO_BASE}</h3>`;
  catSort.forEach(([n,v],i)=>{
    const pct = d.despesaTotal>0?Math.round((v/d.despesaTotal)*100):0;
    const col = CAT_CORES[i%CAT_CORES.length];
    html += `<div class="cat-item">
      <div class="cat-row">
        <div class="cat-name"><div class="cat-dot" style="background:${col}"></div>${n}</div>
        <div class="cat-pct" style="color:${col}">${pct}%</div>
      </div>
      <div class="bar-bg"><div class="bar-fill" style="width:${pct}%;background:${col}"></div></div>
      <div class="cat-vals"><span>${brl(v)}</span><span>${brl(Math.round(v/d.nMeses))}/mês</span></div>
    </div>`;
  });
  html += `</div>
    <div class="card">
      <h3>Distribuição anual</h3>
      <div class="chart-wrap chart-h220"><canvas id="chart-donut-ano"></canvas></div>
    </div>
  </div>`;

  // Projeção até dezembro
  const mesesRestantes = [];
  for(let m=parseInt(d.mesAtual.slice(5))+1; m<=12; m++) {
    mesesRestantes.push(MESES_PT[m-1]);
  }
  if(mesesRestantes.length>0) {
    const orcTotal = Object.values(ORC).reduce((a,b)=>a+b,0);
    const saldoProj = mesesRestantes.length * (RENDA - orcTotal);
    html += `<div class="card mb24">
      <h3>Projeção ${MESES_PT[parseInt(d.mesAtual.slice(5))-1]} → Dezembro <span class="proj-badge">ESTIMATIVA</span></h3>
      <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;margin-top:4px">
        <div style="background:var(--s2);border:1px solid var(--border);border-radius:12px;padding:14px">
          <div class="kpi-label">Meses restantes</div>
          <div class="kpi-val">${mesesRestantes.length}</div>
          <div class="kpi-sub">${mesesRestantes.join(', ')}</div>
        </div>
        <div style="background:var(--s2);border:1px solid var(--border);border-radius:12px;padding:14px">
          <div class="kpi-label">Projeção despesa/mês</div>
          <div class="kpi-val yellow">${brlK(orcTotal)}</div>
          <div class="kpi-sub">base no orçamento</div>
        </div>
        <div style="background:var(--s2);border:1px solid var(--border);border-radius:12px;padding:14px">
          <div class="kpi-label">Saldo proj. até dez</div>
          <div class="kpi-val green">${brlK(saldoProj)}</div>
          <div class="kpi-sub">excedente estimado</div>
        </div>
        <div style="background:var(--s2);border:1px solid var(--border);border-radius:12px;padding:14px">
          <div class="kpi-label">Saldo total proj.</div>
          <div class="kpi-val green">${brlK(d.saldoTotal + saldoProj)}</div>
          <div class="kpi-sub">real + projeção 2026</div>
        </div>
      </div>
    </div>`;
  }

  return html;
}

// ─── LANÇAMENTOS ──────────────────────────────────
function renderLancamentos(d) {
  let html = `<div class="card">
    <h3>Lançamentos recentes — ${d.mesLabel}</h3>`;
  for(const t of d.recentes) {
    const badge = t.quem==='Alex'?'ba':t.quem==='Natalia'?'bn':'bc';
    const dia = t.data?t.data.slice(8)+'/'+t.data.slice(5,7):'';
    html += `<div class="tx-item">
      <div style="flex:1;min-width:0">
        <div class="tx-desc">${t.descricao||'—'}</div>
        <div class="tx-meta"><span>${dia}</span><span>·</span><span>${t.categoria}</span></div>
      </div>
      <div style="text-align:right;flex-shrink:0">
        <div class="tx-val">${brl(t.valor)}</div>
        <span class="badge ${badge}">${t.quem||'Casal'}</span>
      </div>
    </div>`;
  }
  if(!d.recentes.length) html += `<div style="color:var(--muted);text-align:center;padding:32px">Nenhum lançamento em ${d.mesLabel}.</div>`;
  html += `</div>`;
  return html;
}

// ─── DESEJOS ──────────────────────────────────────
function renderDesejos(d) {
  const totalDesejos = DESEJOS.reduce((a,i)=>a+i.valor,0);
  const mesesParaJuntar = Math.ceil(totalDesejos / d.surplusMes);
  const orcTotal = Object.values(ORC).reduce((a,b)=>a+b,0);

  let html = `
  <div class="kpi-grid mb24">
    <div class="kpi">
      <div class="kpi-label">Total desejado</div>
      <div class="kpi-val yellow">${brlK(totalDesejos)}</div>
      <div class="kpi-sub">${DESEJOS.length} itens na lista</div>
    </div>
    <div class="kpi">
      <div class="kpi-label">Surplus atual/mês</div>
      <div class="kpi-val green">${brlK(d.surplusMes)}</div>
      <div class="kpi-sub">disponível p/ poupar</div>
    </div>
    <div class="kpi">
      <div class="kpi-label">Meses p/ quitar tudo</div>
      <div class="kpi-val ${mesesParaJuntar>12?'red':mesesParaJuntar>6?'yellow':'green'}">${mesesParaJuntar}</div>
      <div class="kpi-sub">poupando o surplus</div>
    </div>
    <div class="kpi">
      <div class="kpi-label">Impacto no orçamento</div>
      <div class="kpi-val">${Math.round((totalDesejos/RENDA)*100)}%</div>
      <div class="kpi-sub">da renda mensal</div>
    </div>
  </div>

  <div class="sec-title mb16">Itens aguardando orçamento</div>`;

  for(const item of DESEJOS.sort((a,b)=>(['alta','media','baixa'].indexOf(a.prioridade)-['alta','media','baixa'].indexOf(b.prioridade)))) {
    const meses = Math.ceil(item.valor/d.surplusMes);
    const pct = Math.round((item.valor/RENDA)*100);
    html += `<div class="wish-item prio-${item.prioridade}">
      <div>
        <div class="wish-name">${item.nome}</div>
        <div class="wish-meta">
          <span>${item.obs}</span>
          <span>·</span>
          <span style="color:${item.prioridade==='alta'?'var(--red)':item.prioridade==='media'?'var(--yellow)':'var(--blue)'}">
            Prioridade ${item.prioridade}
          </span>
        </div>
      </div>
      <div>
        <div class="wish-val">${brl(item.valor)}</div>
        <div class="wish-impact">${meses} ${meses===1?'mês':'meses'} poupando · ${pct}% da renda</div>
      </div>
    </div>`;
  }

  html += `<div class="wish-total">
    <div>
      <div style="font-size:11px;color:var(--muted);margin-bottom:4px">TOTAL DA LISTA</div>
      <div style="font-family:var(--display);font-size:22px;font-weight:700;color:var(--yellow)">${brl(totalDesejos)}</div>
    </div>
    <div style="text-align:right">
      <div style="font-size:11px;color:var(--muted);margin-bottom:4px">PREVISÃO DE CONCLUSÃO</div>
      <div style="font-size:14px;font-weight:600">${mesesParaJuntar} meses</div>
      <div style="font-size:11px;color:var(--muted)">se poupar ${brl(d.surplusMes)}/mês</div>
    </div>
  </div>`;

  return html;
}

// ─── CHARTS ──────────────────────────────────────
const chartDefaults = {
  plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>` ${brl(c.raw)}`},backgroundColor:'#141c2e',borderColor:'#1e2d47',borderWidth:1,titleColor:'#e8edf5',bodyColor:'#6b7fa3',padding:10}},
  scales:{x:{grid:{color:'#1e2d47'},ticks:{color:'#6b7fa3',font:{size:10,family:'DM Mono'}}},y:{grid:{color:'#1e2d47'},ticks:{color:'#6b7fa3',font:{size:10,family:'DM Mono'},callback:v=>brlK(v)}}}
};

function buildChartsMensal(d) {
  const cats = Object.entries(d.catMes).filter(([,v])=>v>0);
  if(!cats.length) return;
  const ctx = document.getElementById('chart-donut');
  if(ctx) charts['donut'] = new Chart(ctx, {
    type:'doughnut',
    data:{
      labels: cats.map(([n])=>n),
      datasets:[{data:cats.map(([,v])=>Math.round(v)),backgroundColor:cats.map(([n])=>CAT_CORES[Object.keys(ORC).indexOf(n)%CAT_CORES.length]+'cc'),borderColor:'#0e1420',borderWidth:2}]
    },
    options:{responsive:true,maintainAspectRatio:false,cutout:'65%',plugins:{legend:{display:true,position:'right',labels:{color:'#6b7fa3',font:{size:10,family:'Inter'},boxWidth:10,padding:8}},tooltip:{callbacks:{label:c=>' '+brl(c.raw)},backgroundColor:'#141c2e',borderColor:'#1e2d47',borderWidth:1,titleColor:'#e8edf5',bodyColor:'#6b7fa3',padding:10}}}
  });
}

function buildChartsAnual(d) {
  const ctxB = document.getElementById('chart-barra');
  if(ctxB) charts['barra'] = new Chart(ctxB, {
    type:'bar',
    data:{
      labels: d.serieLabels,
      datasets:[
        {label:'Real',data:d.serieReal,backgroundColor:'#ff4f6d88',borderColor:'#ff4f6d',borderWidth:1.5,borderRadius:4},
        {label:'Projeção',data:d.serieProj,backgroundColor:'#ff4f6d33',borderColor:'#ff4f6d55',borderWidth:1,borderRadius:4,borderDash:[4,4]},
        {label:'Saldo Acum.',data:d.serieAcum,type:'line',borderColor:'#0dff8c',backgroundColor:'#0dff8c15',borderWidth:2,pointRadius:4,pointBackgroundColor:'#0dff8c',tension:.4,fill:true,yAxisID:'y2'}
      ]
    },
    options:{responsive:true,maintainAspectRatio:false,interaction:{mode:'index',intersect:false},
      plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>` ${c.dataset.label}: ${brl(c.raw)}`},backgroundColor:'#141c2e',borderColor:'#1e2d47',borderWidth:1,titleColor:'#e8edf5',bodyColor:'#6b7fa3',padding:10}},
      scales:{
        x:{grid:{color:'#1e2d47'},ticks:{color:'#6b7fa3',font:{size:10,family:'DM Mono'}}},
        y:{grid:{color:'#1e2d47'},ticks:{color:'#6b7fa3',font:{size:10,family:'DM Mono'},callback:v=>brlK(v)},position:'left'},
        y2:{grid:{display:false},ticks:{color:'#0dff8c88',font:{size:9,family:'DM Mono'},callback:v=>brlK(v)},position:'right'}
      }
    }
  });

  const catSort = Object.entries(d.catAno).sort((a,b)=>b[1]-a[1]);
  const ctxD = document.getElementById('chart-donut-ano');
  if(ctxD && catSort.length) charts['donut-ano'] = new Chart(ctxD, {
    type:'doughnut',
    data:{
      labels:catSort.map(([n])=>n),
      datasets:[{data:catSort.map(([,v])=>Math.round(v)),backgroundColor:catSort.map(([n],i)=>CAT_CORES[i%CAT_CORES.length]+'cc'),borderColor:'#0e1420',borderWidth:2}]
    },
    options:{responsive:true,maintainAspectRatio:false,cutout:'60%',plugins:{legend:{display:true,position:'right',labels:{color:'#6b7fa3',font:{size:10,family:'Inter'},boxWidth:10,padding:8}},tooltip:{callbacks:{label:c=>` ${brl(c.raw)}`},backgroundColor:'#141c2e',borderColor:'#1e2d47',borderWidth:1,titleColor:'#e8edf5',bodyColor:'#6b7fa3',padding:10}}}
  });
}

function switchTab(t) { tab=t; render(); }

loadData();
setInterval(loadData, 5*60*1000);
</script>
</body>
</html>
